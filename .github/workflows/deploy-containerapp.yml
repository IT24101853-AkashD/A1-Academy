# Reusable deploy step for the backend Container Apps, called by each ci-*.yml after its image
# has been pushed to Docker Hub. Moves the Container App onto the image tagged with this commit's
# SHA, restarts it, then fails the run unless a new container actually came up running.
#
# Azure login uses GitHub OIDC against a user-assigned managed identity (no password stored in
# GitHub). Required repository secrets: AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID.

name: Deploy Container App

on:
  workflow_call:
    inputs:
      app-name:
        description: Container App name, e.g. a1academy-admin
        required: true
        type: string
      image-repo:
        description: Docker Hub repository name, e.g. a1academy-admin
        required: true
        type: string

env:
  RESOURCE_GROUP: A1-Academy-RG

jobs:
  deploy:
    runs-on: ubuntu-latest
    # One deploy per app at a time; a newer merge waits instead of racing an older one.
    concurrency:
      group: deploy-${{ inputs.app-name }}
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read

    steps:
    - name: Azure Login (OIDC)
      uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    # Runs straight on the ubuntu runner (Azure CLI preinstalled, logged in by the step above)
    # rather than in azure/cli's minimal container, which lacks basic tools such as awk.
    - name: Deploy, restart and verify
      shell: bash
      # Secrets and inputs reach the script as environment variables rather than being pasted
      # into its text with ${{ }}, so their values can never be interpreted as shell code.
      env:
        DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        APP: ${{ inputs.app-name }}
        IMAGE_REPO: ${{ inputs.image-repo }}
        COMMIT_SHA: ${{ github.sha }}
      run: |
          set -e
          az extension add --name containerapp --upgrade --yes --only-show-errors
          IMAGE="docker.io/$DOCKER_USERNAME/$IMAGE_REPO:$COMMIT_SHA"
          START=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          echo "Updating $APP to $IMAGE"
          az containerapp update --name "$APP" --resource-group "$RESOURCE_GROUP" --image "$IMAGE" -o none

          # These apps run on an Express environment, where an update changes the app's template
          # but does not reliably replace the running container (and revision restart isn't
          # supported). An explicit stop/start is what guarantees the new image and config load.
          SUB=$(az account show --query id -o tsv)
          URL="https://management.azure.com/subscriptions/$SUB/resourceGroups/$RESOURCE_GROUP/providers/Microsoft.App/containerApps/$APP"
          echo "Restarting $APP (stop/start)"
          az rest --method post --url "$URL/stop?api-version=2024-03-01" -o none
          for i in $(seq 1 12); do
            [ "$(az containerapp show -n "$APP" -g "$RESOURCE_GROUP" --query properties.runningStatus -o tsv)" = "Stopped" ] && break
            sleep 5
          done
          az rest --method post --url "$URL/start?api-version=2024-03-01" -o none

          # Pass only once a container started after this deploy began is Running - checking the
          # template alone would report success while the old container keeps serving.
          REVISION=$(az containerapp show -n "$APP" -g "$RESOURCE_GROUP" --query properties.latestRevisionName -o tsv)
          NEW_CONTAINER=""
          for i in $(seq 1 24); do
            # ISO-8601 timestamps compare correctly as strings.
            if az containerapp replica list -n "$APP" -g "$RESOURCE_GROUP" --revision "$REVISION" \
                 --query "[].[properties.createdTime, properties.runningState]" -o tsv \
               | awk -v start="$START" '$2 == "Running" && $1 > start { found = 1 } END { exit !found }'; then
              NEW_CONTAINER=yes
              echo "$APP is running a new container on $IMAGE"
              break
            fi
            echo "Attempt $i: waiting for a new running container..."
            sleep 10
          done
          if [ -z "$NEW_CONTAINER" ]; then
            echo "::error::$APP has no new running container 4 minutes after deploying $IMAGE"
            exit 1
          fi

          # Running isn't the same as working: /health/ready only returns 200 once the app can
          # reach its database (see A1Academy.Shared HealthChecks.cs).
          FQDN=$(az containerapp show -n "$APP" -g "$RESOURCE_GROUP" --query properties.configuration.ingress.fqdn -o tsv)
          for i in $(seq 1 12); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "https://$FQDN/health/ready" || true)
            if [ "$CODE" = "200" ]; then
              echo "OK: $APP is ready (https://$FQDN/health/ready -> 200)"
              exit 0
            fi
            echo "Readiness attempt $i: /health/ready -> $CODE"
            sleep 10
          done
          echo "::error::$APP is running but /health/ready never returned 200 (last: $CODE) - it cannot reach its database or is failing to start"
          exit 1
