name: Gateway Service CI

on:
  # Manual "Run workflow" button in the Actions tab: test, build and redeploy main on demand.
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - 'backend/A1Academy.Gateway/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'backend/A1Academy.Gateway/**'

jobs:
  build-and-dockerize:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
      with:
        dotnet-version: '10.0.x'

    - name: Log in to Docker Hub
      if: github.event_name != 'pull_request'
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

    - name: Build Docker Image
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
      with:
        context: ./backend
        file: ./backend/A1Academy.Gateway/Dockerfile
        # Pull requests only build (to prove the Dockerfile works); only main publishes, so
        # unmerged code can never land on the :latest tag or a deployable SHA tag.
        push: ${{ github.event_name != 'pull_request' }}
        # Dependabot PRs get no secrets, so fall back to a local name (PR builds never push).
        tags: |
          ${{ secrets.DOCKER_USERNAME || 'local' }}/a1academy-gateway:latest
          ${{ secrets.DOCKER_USERNAME || 'local' }}/a1academy-gateway:${{ github.sha }}

  deploy:
    needs: build-and-dockerize
    # Deploy only main (merges or a manual run) - pull requests stop after the image build.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/deploy-containerapp.yml
    with:
      app-name: a1academy-gateway
      image-repo: a1academy-gateway
    secrets: inherit
