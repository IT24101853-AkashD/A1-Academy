name: Gateway Service CI

on:
  # Manual "Run workflow" button in the Actions tab: test, build and redeploy main on demand.
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - 'backend/A1Academy.Gateway/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'backend/A1Academy.Gateway/**'

jobs:
  build-and-dockerize:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Log in to Docker Hub
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker Image
      uses: docker/build-push-action@v5
      with:
        context: ./backend
        file: ./backend/A1Academy.Gateway/Dockerfile
        # Pull requests only build (to prove the Dockerfile works); only main publishes, so
        # unmerged code can never land on the :latest tag or a deployable SHA tag.
        push: ${{ github.event_name != 'pull_request' }}
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/a1academy-gateway:latest
          ${{ secrets.DOCKER_USERNAME }}/a1academy-gateway:${{ github.sha }}

  deploy:
    needs: build-and-dockerize
    # Deploy only main (merges or a manual run) - pull requests stop after the image build.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/deploy-containerapp.yml
    with:
      app-name: a1academy-gateway
      image-repo: a1academy-gateway
    secrets: inherit
