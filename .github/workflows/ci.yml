name: Build, Test, and Containerize Pipeline

on:
  push:
    branches: [ "main", "feature/*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-test-and-dockerize:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore Dependencies
      run: dotnet restore backend/A1Academy.sln

    - name: Build Application
      run: dotnet build backend/A1Academy.sln --no-restore --configuration Release

    - name: Execute Automated Unit Tests
      run: dotnet test backend/A1Academy.sln --no-build --verbosity normal --configuration Release

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker Image
      uses: docker/build-push-action@v5
      with:
        context: ./backend/A1Academy.API
        file: ./backend/A1Academy.API/Dockerfile
        push: false
        tags: a1academy-api:latest