name: End-to-End Tests

on:
  pull_request:
    branches: [ "main" ]

jobs:
  e2e-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Start Test Environment
        run: docker-compose -f docker-compose.e2e.yml up -d --build

      - name: Wait for services to be ready
        run: |
          echo "Waiting for Backend API..."
          timeout 60 bash -c 'until curl -s http://localhost:5123/swagger/index.html > /dev/null; do sleep 2; done'
          echo "Waiting for Frontend..."
          timeout 60 bash -c 'until curl -s http://localhost:4173 > /dev/null; do sleep 2; done'
