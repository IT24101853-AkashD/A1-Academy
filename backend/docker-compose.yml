services:
  postgres:
    image: postgres:15-alpine
    container_name: local_postgres
    environment:
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: SecurePassword123!
      POSTGRES_DB: appdb
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: local_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: local_kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  gateway:
    build:
      context: ./
      dockerfile: A1Academy.Gateway/Dockerfile
    container_name: local_gateway
    ports:
      - "5100:8080"
    depends_on:
      - auth_service
      - admin_service
      - teacher_service

  auth_service:
    build:
      context: ./
      dockerfile: A1Academy.AuthService/Dockerfile
    container_name: local_auth
    environment:
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=appdb;Username=appuser;Password=SecurePassword123!
      - Kafka__BootstrapServers=kafka:9092
    depends_on:
      - postgres
      - kafka

  admin_service:
    build:
      context: ./
      dockerfile: A1Academy.AdminService/Dockerfile
    container_name: local_admin
    environment:
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=appdb;Username=appuser;Password=SecurePassword123!
      - Kafka__BootstrapServers=kafka:9092
    depends_on:
      - postgres
      - kafka

  teacher_service:
    build:
      context: ./
      dockerfile: A1Academy.TeacherService/Dockerfile
    container_name: local_teacher
    environment:
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=appdb;Username=appuser;Password=SecurePassword123!
      - Kafka__BootstrapServers=kafka:9092
    depends_on:
      - postgres
      - kafka

  student_service:
    build:
      context: ./
      dockerfile: A1Academy.StudentService/Dockerfile
    container_name: local_student
    environment:
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=appdb;Username=appuser;Password=SecurePassword123!
      - Kafka__BootstrapServers=kafka:9092
    depends_on:
      - postgres
      - kafka

volumes:
  postgres_data: