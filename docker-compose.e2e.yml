version: '3.8'
services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: apppassword
      POSTGRES_DB: e2edb
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d e2edb"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend/A1Academy.API
      dockerfile: Dockerfile
    environment:
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=e2edb;Username=appuser;Password=apppassword
      - ASPNETCORE_ENVIRONMENT=Testing
      - Jwt__Key=SuperSecretTestingKey12345678901234567890
      - Jwt__Issuer=A1Academy
      - Jwt__Audience=A1AcademyUsers
    ports:
      - "5123:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      - VITE_API_URL=http://localhost:5123
    ports:
      - "4173:80"
    depends_on:
      - api
