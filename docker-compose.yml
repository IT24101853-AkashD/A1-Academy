version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: a1admin
      POSTGRES_PASSWORD: Password123!
      POSTGRES_DB: a1academy
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5000:8080"
    environment:
      - ConnectionStrings__DefaultConnection=Host=db;Database=a1academy;Username=a1admin;Password=Password123!
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
