version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: local_postgres
    environment:
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: SecurePassword123!
      POSTGRES_DB: appdb
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: local_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: local_kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # Two listeners: containers reach the broker as kafka:29092, apps run on the host
      # (dotnet run) reach it as localhost:9092.
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:29092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  gateway:
    build:
      context: ./backend
      dockerfile: A1Academy.Gateway/Dockerfile
    container_name: local_gateway
    environment:
      - ReverseProxy__Clusters__authCluster__Destinations__destination1__Address=http://auth:8080/
      - ReverseProxy__Clusters__adminCluster__Destinations__destination1__Address=http://admin:8080/
      - ReverseProxy__Clusters__teacherCluster__Destinations__destination1__Address=http://teacher:8080/
      - ReverseProxy__Clusters__studentCluster__Destinations__destination1__Address=http://student:8080/
    ports:
      - "5100:8080"
    depends_on:
      - auth
      - admin
      - teacher
      - student

  auth:
    build:
      context: ./backend
      dockerfile: A1Academy.AuthService/Dockerfile
    container_name: local_auth
    environment:
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=appdb;Username=appuser;Password=SecurePassword123!
      - Kafka__BootstrapServers=kafka:29092
      # LOCAL DEVELOPMENT ONLY - production uses Azure Container App secrets (see scripts/devops-azure-setup.sh).
      - Jwt__Key=local-dev-only-jwt-signing-key-not-used-in-production-000000
      - Admin__Password=LocalAdmin123!
    depends_on:
      postgres:
        condition: service_started
      kafka:
        condition: service_healthy

  admin:
    build:
      context: ./backend
      dockerfile: A1Academy.AdminService/Dockerfile
    container_name: local_admin
    environment:
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=appdb;Username=appuser;Password=SecurePassword123!
      - Kafka__BootstrapServers=kafka:29092
      # LOCAL DEVELOPMENT ONLY - production uses Azure Container App secrets (see scripts/devops-azure-setup.sh).
      - Jwt__Key=local-dev-only-jwt-signing-key-not-used-in-production-000000
      - Admin__Password=LocalAdmin123!
    depends_on:
      postgres:
        condition: service_started
      kafka:
        condition: service_healthy

  teacher:
    build:
      context: ./backend
      dockerfile: A1Academy.TeacherService/Dockerfile
    container_name: local_teacher
    environment:
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=appdb;Username=appuser;Password=SecurePassword123!
      - Kafka__BootstrapServers=kafka:29092
      # LOCAL DEVELOPMENT ONLY - production uses Azure Container App secrets (see scripts/devops-azure-setup.sh).
      - Jwt__Key=local-dev-only-jwt-signing-key-not-used-in-production-000000
    depends_on:
      postgres:
        condition: service_started
      kafka:
        condition: service_healthy

  student:
    build:
      context: ./backend
      dockerfile: A1Academy.StudentService/Dockerfile
    container_name: local_student
    environment:
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=appdb;Username=appuser;Password=SecurePassword123!
      - Kafka__BootstrapServers=kafka:29092
      # LOCAL DEVELOPMENT ONLY - production uses Azure Container App secrets (see scripts/devops-azure-setup.sh).
      - Jwt__Key=local-dev-only-jwt-signing-key-not-used-in-production-000000
    depends_on:
      postgres:
        condition: service_started
      kafka:
        condition: service_healthy

volumes:
  postgres_data:
